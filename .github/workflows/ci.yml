name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint·테스트·빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  responsive:
    name: 브라우저·반응형 검사
    # 실제 BE 이미지(ARM 전용)와 Postgres를 띄워 실행하므로 ARM 러너 사용
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moagwa
          POSTGRES_PASSWORD: moagwa
          POSTGRES_DB: moagwa_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moagwa -d moagwa_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: BE 실행(develop 이미지, local 프로필)
        # local 프로필: 개발용 로그인·관리자 계정, 인증 코드 응답 노출. 학사일정은 e2e/static의 고정 페이지에서 수집
        # 브라우저 요청은 FE 개발 서버(3100)의 Origin을 달고 프록시되므로 CORS 허용 필요
        run: |
          docker run -d --name be --network host \
            -e SPRING_PROFILES_ACTIVE=local -e SERVER_PORT=18080 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/moagwa_e2e \
            -e CORS_ALLOWED_ORIGINS=http://localhost:3100 \
            -e ACADEMIC_CALENDAR_FETCH_URL='http://localhost:3101/academic-{year}.html' \
            ghcr.io/moa-gwa/be:develop
          for i in $(seq 1 60); do curl -sf localhost:18080/api/categories > /dev/null && exit 0; sleep 2; done
          docker logs be; exit 1
      - name: psql 설치
        # 크롤링 공지는 작성 API가 없어 테스트 준비 단계에서 SQL로 넣음
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - name: BE 로그
        if: failure()
        run: docker logs be
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-responsive-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: 이미지 빌드
    needs: [verify, responsive]
    # PR 제목·본문 수정(edited)은 코드 변경이 없어 다시 빌드하지 않음
    if: github.event.action != 'edited'
    # 운영 노드(EC2 Graviton)와 같은 ARM 러너에서 에뮬레이션 없이 빌드
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 태그 생성
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/moa-gwa/fe
          # sha-<짧은 해시>: 배포에 쓰는 고정 태그, 브랜치 이름: 최신 빌드 확인용
          tags: |
            type=sha
            type=ref,event=branch
      - name: 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          # PR은 빌드만 검증
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* 값은 번들에 박히는 공개 값이라 Secrets가 아닌 저장소 Variables에서 주입
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.moagwa.kr' }}
            NEXT_PUBLIC_KAKAO_CLIENT_ID=${{ vars.NEXT_PUBLIC_KAKAO_CLIENT_ID }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
            NEXT_PUBLIC_TOSS_CLIENT_KEY=${{ vars.NEXT_PUBLIC_TOSS_CLIENT_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 배포 태그 갱신
    needs: image
    # main 푸시만 운영 배포, develop은 이미지 빌드까지
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 같은 저장소의 배포 커밋이 순서대로 쌓이도록 한 번에 하나만 실행
    concurrency: deploy-tag
    steps:
      - name: infra 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          repository: Moa-Gwa/infra
          # infra 쓰기 전용 deploy key. GITHUB_TOKEN은 이 저장소에만 쓸 수 있음
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
      - name: 이미지 태그 변경·푸시
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/moa-gwa/fe
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          # 그사이 main에 더 새 커밋이 들어왔으면 그 실행이 배포하므로 건너뜀(늦게 끝난 이전 빌드가 운영을 되돌리지 않도록)
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" -q .sha)
          [ "$LATEST" = "$GITHUB_SHA" ] || { echo "main 최신 커밋 ${LATEST::7}이 아니므로 건너뜀"; exit 0; }
          TAG="sha-${GITHUB_SHA::7}"
          FILE=k8s/overlays/prod/kustomization.yaml
          # images 항목에서 이 이미지 이름 다음 줄의 newTag 교체
          sed -i "\#name: ${IMAGE}\$#{n;s#newTag: .*#newTag: ${TAG}#;}" "$FILE"
          grep -A1 "name: ${IMAGE}$" "$FILE" | grep -q "newTag: ${TAG}$" || { echo "::error::${FILE}에서 ${IMAGE} 태그를 찾지 못함"; exit 1; }
          git diff --quiet && { echo "이미 ${TAG} 배포 상태"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(deploy): 프론트 이미지 ${TAG} 배포" -m "$SOURCE"
          # 다른 저장소 CI가 먼저 푸시했으면 최신 커밋 위로 옮겨 다시 시도
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1

  pr-title:
    name: PR 제목 검사
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits 형식과 한국어 설명 확인
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! grep -qP '^(feat|fix|refactor|docs|test|chore)(\([a-z0-9-]+\))?: .*\p{Hangul}' <<< "$PR_TITLE"; then
            echo "::error::PR 제목은 '<type>(<scope>): <한국어 설명>' 형식이어야 합니다. type: feat, fix, refactor, docs, test, chore"
            exit 1
          fi
